name: smoke

# Real end-to-end test: starts the whole Compose stack, waits for the
# Cloudflare URL, then logs in to Termix through that public URL.
#
# TryCloudflare is a free, best-effort service with per-IP rate limits, so this
# workflow is intentionally non-blocking (continue-on-error).

on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Prepare env
        run: |
          mkdir -p var/host var/host-ssh
          {
            echo "PUID=$(id -u)"
            echo "PGID=$(id -g)"
            echo "SSH_USER=$(id -un)"
            echo "AUTHORIZE_SSH_KEY=false"
            echo "HOST_SSH_DIR=$(pwd)/var/host-ssh"
          } > .env
          cat .env

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for the public URL
        run: |
          for _ in $(seq 1 90); do
            [ -s var/host/url.txt ] && break
            sleep 2
          done
          test -s var/host/url.txt
          echo "url=$(cat var/host/url.txt)"

      - name: Reach Termix through the tunnel
        run: |
          URL="$(cat var/host/url.txt)"
          for i in $(seq 1 10); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' "$URL/" 2>/dev/null || true)"
            # A fresh trycloudflare name can be cached as NXDOMAIN by the local
            # stub resolver; fall back to resolving through Cloudflare's DoH.
            if [ "$code" != "200" ]; then
              code="$(curl -sS --doh-url https://1.1.1.1/dns-query -o /dev/null -w '%{http_code}' "$URL/" 2>/dev/null || true)"
            fi
            echo "attempt $i: GET $URL/ -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          exit 1

      - name: Log in to Termix through the tunnel
        run: |
          URL="$(cat var/host/url.txt)"
          PASS="$(sed -n 's/^  admin_password: "\(.*\)"/\1/p' etc/config.yml)"
          test -n "$PASS"
          BODY="{\"username\":\"admin\",\"password\":\"$PASS\"}"
          code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$URL/users/login" \
            -H 'Content-Type: application/json' -d "$BODY" 2>/dev/null || true)"
          if [ "$code" != "200" ]; then
            code="$(curl -sS --doh-url https://1.1.1.1/dns-query -o /dev/null -w '%{http_code}' \
              -X POST "$URL/users/login" -H 'Content-Type: application/json' -d "$BODY")"
          fi
          echo "POST $URL/users/login -> $code"
          [ "$code" = "200" ]

      - name: Registration is closed
        run: |
          URL="$(cat var/host/url.txt)"
          allowed="$(curl -sS --doh-url https://1.1.1.1/dns-query "$URL/users/registration-allowed" | jq -r .allowed)"
          echo "registration allowed: $allowed"
          [ "$allowed" = "false" ]

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 300

      - name: Tear down
        if: always()
        run: docker compose down -v
