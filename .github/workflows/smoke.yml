name: smoke

# Real end-to-end test: starts the whole Compose stack, waits for the
# Cloudflare URL, then logs in to Termix through that public URL.
#
# TryCloudflare is a free, best-effort service with per-IP rate limits, so this
# workflow is intentionally non-blocking (continue-on-error).

on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Prepare env
        run: |
          mkdir -p var/host var/host-ssh
          {
            echo "PUID=$(id -u)"
            echo "PGID=$(id -g)"
            echo "SSH_USER=$(id -un)"
            echo "AUTHORIZE_SSH_KEY=false"
            echo "HOST_SSH_DIR=$(pwd)/var/host-ssh"
          } > .env
          cat .env

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for the public URL
        run: |
          for _ in $(seq 1 90); do
            [ -s var/host/url.txt ] && break
            sleep 2
          done
          test -s var/host/url.txt
          echo "url=$(cat var/host/url.txt)"

      - name: Reach Termix through the tunnel
        run: |
          URL="$(cat var/host/url.txt)"
          for i in $(seq 1 10); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' "$URL/" 2>/dev/null || true)"
            # A fresh trycloudflare name can be cached as NXDOMAIN by the local
            # stub resolver; fall back to resolving through Cloudflare's DoH.
            if [ "$code" != "200" ]; then
              code="$(curl -sS --doh-url https://1.1.1.1/dns-query -o /dev/null -w '%{http_code}' "$URL/" 2>/dev/null || true)"
            fi
            echo "attempt $i: GET $URL/ -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          exit 1

      - name: Log in to Termix through the tunnel
        run: |
          URL="$(cat var/host/url.txt)"
          PASS="$(sed -n 's/^  admin_password: "\(.*\)"/\1/p' etc/config.yml)"
          test -n "$PASS"
          BODY="{\"username\":\"admin\",\"password\":\"$PASS\"}"
          code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$URL/users/login" \
            -H 'Content-Type: application/json' -d "$BODY" 2>/dev/null || true)"
          if [ "$code" != "200" ]; then
            code="$(curl -sS --doh-url https://1.1.1.1/dns-query -o /dev/null -w '%{http_code}' \
              -X POST "$URL/users/login" -H 'Content-Type: application/json' -d "$BODY")"
          fi
          echo "POST $URL/users/login -> $code"
          [ "$code" = "200" ]

      - name: Registration is closed
        run: |
          URL="$(cat var/host/url.txt)"
          allowed="$(curl -sS --doh-url https://1.1.1.1/dns-query "$URL/users/registration-allowed" | jq -r .allowed)"
          echo "registration allowed: $allowed"
          [ "$allowed" = "false" ]

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 300

      - name: Tear down
        if: always()
        run: docker compose down -v

  opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Generate a test SSH key
        run: |
          mkdir -p var/ssh
          ssh-keygen -q -t ed25519 -N '' -C "tty-tunnel ci test key" -f var/ssh/id_ed25519

      - name: Build the opencode image
        run: docker build -t tty-tunnel-opencode:ci ./opencode

      - name: Start the container
        run: |
          docker network create ttt-ci
          docker run -d --name ttt-opencode --network ttt-ci \
            -e OPENCODE_SSH_PASSWORD=ci-password \
            -v "$PWD/var/ssh:/keys:ro" \
            tty-tunnel-opencode:ci

      - name: OpenCode is installed
        run: |
          docker exec ttt-opencode opencode --version
          docker exec ttt-opencode sh -c 'command -v fzf rg bat eza tmux git jq'

      - name: Key auth, exec and SFTP work
        run: |
          docker run --rm --network ttt-ci -v "$PWD/var/ssh:/keys:ro" alpine sh -ec '
            apk add --no-cache openssh-client >/dev/null
            ssh -i /keys/id_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o BatchMode=yes opencode@ttt-opencode "echo SSH_OK; opencode --version" | tee /tmp/out
            grep -q SSH_OK /tmp/out
            printf "ls /workspace\n" > /tmp/batch
            sftp -i /keys/id_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -b /tmp/batch opencode@ttt-opencode
          '

      - name: Interactive session lands in the OpenCode TUI
        run: |
          timeout 20 docker run --rm --network ttt-ci -v "$PWD/var/ssh:/keys:ro" alpine sh -c '
            apk add --no-cache openssh-client >/dev/null
            timeout 15 ssh -tt -i /keys/id_ed25519 -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR opencode@ttt-opencode >/dev/null 2>&1 || true
          ' || true
          docker exec ttt-opencode su-exec opencode tmux list-panes -a -F "#{pane_current_command} #{pane_current_path}" | tee /tmp/panes
          grep -q "opencode /workspace" /tmp/panes

      - name: Logs on failure
        if: failure()
        run: docker logs ttt-opencode

      - name: Tear down
        if: always()
        run: |
          docker rm -f ttt-opencode || true
          docker network rm ttt-ci || true

  gotty:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Build the gotty image
        run: docker build -t tty-tunnel-gotty:ci ./gotty

      - name: Start it with a harmless command
        run: |
          docker run -d --name ttt-gotty -p 127.0.0.1:18080:8080 \
            -e GOTTY_USER=ci \
            -e GOTTY_PASSWORD=ci-pass \
            -e GOTTY_WS_ORIGIN='.*' \
            -e GOTTY_ENABLE_WEBGL=false \
            -e GOTTY_COMMAND='tail -f /etc/hostname' \
            tty-tunnel-gotty:ci
          sleep 4

      - name: The page is protected by basic auth
        run: |
          anon=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/)
          auth=$(curl -s -o /dev/null -w '%{http_code}' -u ci:ci-pass http://127.0.0.1:18080/)
          echo "anonymous=$anon authenticated=$auth"
          test "$anon" = "401"
          test "$auth" = "200"

      - name: The WebSocket carries terminal output
        run: python3 scripts/ws-check.py 127.0.0.1 18080 ci ci-pass plain 10

      - name: Logs on failure
        if: failure()
        run: docker logs ttt-gotty

      - name: Tear down
        if: always()
        run: docker rm -f ttt-gotty
