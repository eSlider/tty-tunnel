name: release-please

# Automatic semantic versioning from Conventional Commits.
#
#   feat: ...            -> minor bump
#   fix: ...             -> patch bump
#   feat!: ... / BREAKING CHANGE: -> major bump
#   chore:/ci:/docs: ... -> no release (unless a ! is present)
#
# It opens (or updates) a "Release PR" that bumps version.txt, the manifest and
# CHANGELOG.md. Merging that PR creates the vX.Y.Z tag and the GitHub Release,
# which in turn makes ci.yml publish the versioned images.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # A tag created by the action uses GITHUB_TOKEN, and such events do not
      # start other workflows. Dispatch ci.yml explicitly on the new tag so the
      # versioned images (X.Y.Z, X.Y, X, latest) are actually published.
      - name: Publish the release image
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run ci.yml -R "${{ github.repository }}" --ref "${{ steps.release.outputs.tag_name }}"
          echo "dispatched ci.yml for ${{ steps.release.outputs.tag_name }}"
